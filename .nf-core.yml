lint:
  # Project-specific versions: PR template links to the `main` branch (the
  # template renders `master`); issue config omits the nf-core Slack channel,
  # which does not exist for this non-nf-core pipeline.
  files_unchanged:
    - .github/PULL_REQUEST_TEMPLATE.md
    - .github/ISSUE_TEMPLATE/config.yml
  files_exist:
    # AWS full-size tests are not part of the nf-core/tools 4.1.0 template and
    # need nf-core Seqera/AWS secrets this repository does not have.
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
    - CODE_OF_CONDUCT.md
    - assets/nf-core-variantinterpretation_logo_light.png
    - docs/images/nf-core-variantinterpretation_logo_light.png
    - docs/images/nf-core-variantinterpretation_logo_dark.png
  multiqc_config:
    - report_comment
  nextflow_config:
    - manifest.name
    - manifest.homePage
nf_core_version: 4.1.0
repository_type: pipeline
template:
  author: CIO-ABCD
  description: Pipeline to add biological and clinical knowledge to genomic variants.
  force: false
  is_nfcore: false
  name: variantinterpretation
  org: cio-abcd
  outdir: .
  version: 1.2.0
